name: B2 AMM verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install exact recorded tools and verify binary hashes
        run: bash scripts/install-ci-tools.sh
      - name: Format and compiler configuration
        run: |
          forge --version
          forge fmt --check
          forge config
          forge build --sizes
      - name: Vendored integrity and independent reference
        run: |
          python3 scripts/dependencies.py
          python3 scripts/reference_model.py --check
      - name: Unit integration fuzz and stateful invariant campaign
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vv
      - name: Core coverage gate
        run: |
          forge coverage --ir-minimum --report summary --report lcov
          python3 scripts/coverage_gate.py lcov.info
      - name: Gas regression under recorded default profile
        run: forge snapshot --match-contract AMMTest --fuzz-seed 0x20261105 --check
      - name: Complete static finding baseline gate
        run: python3 scripts/static_review.py
      - name: Actual local transaction smoke
        run: python3 scripts/local_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-evidence
          path: |
            evidence/
            lcov.info
            .gas-snapshot
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.8.1
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
        working-directory: .
      - run: npx playwright install --with-deps chromium
        working-directory: .
      - run: python3 scripts/browser_smoke.py
        working-directory: .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: amm-browser-evidence
          path: evidence/browser-current/
